<style>

  font-size:12.5px;resize:vertical}

<script>
(function(){
"use strict";
/* Namespaced so nothing here can collide with TASKS, M, F, ORDER, $, el… */
var LBX=window.LBX={};

var K_CSV="LBX.finder", K_PAD="LBX.pad", K_TAB="LBX.tab";
var MAXROWS=4000;

function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function rm(k){try{localStorage.removeItem(k)}catch(e){}}
function E(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function D(id){return document.getElementById(id)}
function say(m){if(typeof toast==="function")toast(m)}

/* ---------- bridges into the board ----------
   Guarded: if a global isn't there, the tab degrades instead of throwing. */
function boardFrogs(){
  if(typeof alive!=="function")return[];
  return alive().filter(function(t){
    return t.frog&&t.status!=="Done"&&t.status!=="Archived"&&t.status!=="Paused"});
}
function boardAdd(title,raw){
  if(typeof TASKS==="undefined"||typeof nowISO!=="function")return false;
  var now=nowISO();
  TASKS.push({id:"SP-"+Math.random().toString(36).slice(2,8),
    title:title,cat:"Unreviewed Intake",proj:"",tier:"",status:"Open",
    start:"",due:"",effort:"",prio:"",parent:"",notes:"",
    created:now,touched:now,frog:false,pin:"",verify:false,
    src:"Scratchpad sweep",raw:raw||title});
  return true;
}

/* ============================================================
   CSV — quoted fields, embedded commas and newlines, doubled
   quotes, CRLF, BOM. Tab-separated paste from a sheet works too.
   ============================================================ */
function parseDelim(text,d){
  var rows=[],row=[],f="",i=0,q=false,n=text.length,c,nx;
  if(text.charCodeAt(0)===0xFEFF)i=1;
  for(;i<n;i++){c=text[i];
    if(q){ if(c==='"'){nx=text[i+1];if(nx==='"'){f+='"';i++}else q=false} else f+=c }
    else { if(c==='"')q=true;
      else if(c===d){row.push(f);f=""}
      else if(c==="\n"){row.push(f);f="";rows.push(row);row=[]}
      else if(c==="\r"){}
      else f+=c }}
  if(f.length||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(v){return v&&v.trim()!==""})});
}
function sniff(t){var l=t.split(/\r?\n/,1)[0]||"";
  return (l.match(/\t/g)||[]).length>(l.match(/,/g)||[]).length?"\t":","}

var ALIAS={date:"date",when:"date",created:"date",
tool:"tool",ai:"tool",platform:"tool",source:"tool",model:"tool",
title:"title",name:"title",chat:"title",subject:"title",
keywords:"keywords",tags:"keywords",terms:"keywords",notes:"keywords",
project:"project",area:"project",client:"project",category:"project",
url:"url",link:"url",href:"url",address:"url"};

function norm(h){return String(h||"").trim().toLowerCase().replace(/[\s_\-]+/g,"")}
function mapHead(h){var m={},seen={};h.forEach(function(x,i){var f=ALIAS[norm(x)];
  if(f&&!seen[f]){m[f]=i;seen[f]=1}});return m}
function isHead(r){var n=0;r.forEach(function(x){if(ALIAS[norm(x)])n++});return n>=2}

function safeUrl(u){u=String(u||"").trim();
  if(!u||!/^https?:\/\//i.test(u))return "";
  try{var p=new URL(u);return(p.protocol==="http:"||p.protocol==="https:")?p.href:""}catch(e){return ""}}

function dkey(v){v=String(v||"").trim();if(!v)return -Infinity;
  var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return +m[1]*10000+ +m[2]*100+ +m[3];
  m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m)return +m[3]*10000+ +m[1]*100+ +m[2];
  var t=Date.parse(v);
  if(!isNaN(t)){var d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
  return -Infinity}

function build(text){
  var raw=parseDelim(text,sniff(text));
  if(!raw.length)return{rows:[],skipped:0};
  var headed=isHead(raw[0]);
  var map=headed?mapHead(raw[0]):{date:0,tool:1,title:2,keywords:3,project:4,url:5};
  var body=headed?raw.slice(1):raw,out=[],skipped=0;
  body.forEach(function(r){
    function c(f){var i=map[f];return(i===undefined||r[i]===undefined)?"":String(r[i]).trim()}
    var o={date:c("date"),tool:c("tool"),title:c("title"),
           keywords:c("keywords"),project:c("project"),url:safeUrl(c("url"))};
    if(!o.title&&!o.keywords&&!o.url){skipped++;return}
    if(!o.title)o.title=o.url||"(untitled)";
    o._s=(o.title+" "+o.keywords+" "+o.project+" "+o.tool).toLowerCase();
    o._d=dkey(o.date);
    out.push(o)});
  return{rows:out,skipped:skipped,headed:headed};
}

/* ============================================================
   Chat Finder
   ============================================================ */
var ROWS=[],VIEW=[],SORT={f:"date",dir:-1};
var q,fTool,fProj,body,meta,trunc,badge,loaded,blank;

function uniq(f){var seen={},o=[];
  ROWS.forEach(function(r){var v=r[f];if(v&&!seen[v]){seen[v]=1;o.push(v)}});
  return o.sort(function(a,b){return a.localeCompare(b)})}
function fill(sel,vals,label){while(sel.options.length>1)sel.remove(1);
  vals.forEach(function(v){var o=E("option",null,v);o.value=v;sel.add(o)});
  sel.options[0].textContent="All "+label}
function terms(v){return String(v||"").toLowerCase().split(/\s+/).filter(Boolean)}

function apply(){
  var ts=terms(q.value),t=fTool.value,p=fProj.value,i,j,r,ok;
  VIEW=[];
  for(i=0;i<ROWS.length;i++){r=ROWS[i];
    if(t&&r.tool!==t)continue;
    if(p&&r.project!==p)continue;
    ok=true;
    for(j=0;j<ts.length;j++)if(r._s.indexOf(ts[j])===-1){ok=false;break}
    if(ok)VIEW.push(r)}
  sortView();draw(ts);
}
function sortView(){var f=SORT.f,d=SORT.dir;
  VIEW.sort(function(a,b){var x,y;
    if(f==="date"){x=a._d;y=b._d;return x===y?a.title.localeCompare(b.title):(x<y?-1:1)*d}
    x=String(a[f]||"").toLowerCase();y=String(b[f]||"").toLowerCase();
    if(x===y)return a._d===b._d?0:(a._d<b._d?1:-1);
    return(x<y?-1:1)*d})}

/* highlight without innerHTML */
function mark(node,text,ts){
  text=String(text||"");
  if(!ts.length||!text){node.appendChild(document.createTextNode(text));return}
  var low=text.toLowerCase(),hits=[],i,k,at;
  for(k=0;k<ts.length;k++){at=0;
    while((at=low.indexOf(ts[k],at))!==-1){hits.push([at,at+ts[k].length]);at+=ts[k].length}}
  if(!hits.length){node.appendChild(document.createTextNode(text));return}
  hits.sort(function(a,b){return a[0]-b[0]});
  var m=[hits[0]];
  for(i=1;i<hits.length;i++){var L=m[m.length-1];
    if(hits[i][0]<=L[1])L[1]=Math.max(L[1],hits[i][1]);else m.push(hits[i])}
  var pos=0;
  m.forEach(function(h){
    if(h[0]>pos)node.appendChild(document.createTextNode(text.slice(pos,h[0])));
    var el2=E("mark");el2.textContent=text.slice(h[0],h[1]);node.appendChild(el2);pos=h[1]});
  if(pos<text.length)node.appendChild(document.createTextNode(text.slice(pos)));
}

function draw(ts){
  ts=ts||terms(q.value);
  var frag=document.createDocumentFragment(),n=Math.min(VIEW.length,MAXROWS),i,r,tr,td,a;
  for(i=0;i<n;i++){r=VIEW[i];tr=E("tr");
    td=E("td","lbxdate");td.textContent=r.date||"\u2014";tr.appendChild(td);
    td=E("td");
    if(r.tool){var c=E("span","pill");mark(c,r.tool,ts);td.appendChild(c)}else td.textContent="\u2014";
    tr.appendChild(td);
    td=E("td");
    if(r.url){a=E("a");a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";
      mark(a,r.title,ts);td.appendChild(a)}else mark(td,r.title,ts);
    tr.appendChild(td);
    td=E("td","lbxkw");mark(td,r.keywords,ts);tr.appendChild(td);
    td=E("td");mark(td,r.project,ts);tr.appendChild(td);
    frag.appendChild(tr)}
  body.textContent="";
  if(!VIEW.length){tr=E("tr");td=E("td");td.colSpan=5;
    td.style.cssText="padding:26px 12px;text-align:center;color:var(--muted)";
    td.textContent="Nothing matches. Try fewer words, or clear the filters.";
    tr.appendChild(td);body.appendChild(tr)}
  else body.appendChild(frag);
  meta.textContent=VIEW.length===ROWS.length
    ?ROWS.length+(ROWS.length===1?" chat":" chats")
    :VIEW.length+" of "+ROWS.length;
  if(VIEW.length>MAXROWS){trunc.hidden=false;
    trunc.textContent="Showing the first "+MAXROWS+". Narrow the search to see the rest."}
  else trunc.hidden=true;
  badge.hidden=!ROWS.length;badge.textContent=String(ROWS.length);
  document.querySelectorAll(".lbxtbl th[data-sort]").forEach(function(th){
    var d=th.querySelector(".lbxdir");
    if(th.getAttribute("data-sort")===SORT.f){
      d.textContent=SORT.dir===1?"\u25B2":"\u25BC";
      th.setAttribute("aria-sort",SORT.dir===1?"ascending":"descending")}
    else{d.textContent="";th.removeAttribute("aria-sort")}});
}

function loadCsv(text,remember){
  var res=build(text);
  if(!res.rows.length){
    alert("No usable rows.\n\nExpected a header row with at least two of: date, tool, title, keywords, project, url.");
    return false}
  ROWS=res.rows;
  fill(fTool,uniq("tool"),"tools");fill(fProj,uniq("project"),"projects");
  q.value="";fTool.value="";fProj.value="";SORT={f:"date",dir:-1};
  apply();loaded.hidden=false;blank.hidden=true;
  if(remember!==false)s(K_CSV,JSON.stringify(ROWS.map(function(r){
    return{date:r.date,tool:r.tool,title:r.title,keywords:r.keywords,project:r.project,url:r.url}})));

function readFile(f){if(!f)return;var r=new FileReader();

/* ============================================================
   Scratchpad
   ============================================================ */
var listEl,saved,padN,frogs,bulkBox,timer=null;
var ITEMS=[];

/* A line beginning # is a heading: no checkbox, never filed, cleared with
   the rest. Kept from the plain-text version so the habit still works. */
function isHeadingLine(t){ return String(t||"").trim().charAt(0)==="#"; }

/* One parser for three inputs: the legacy plain-text pad, a pasted block of
   dictated lines, and this list's own "[x] " / "[ ] " round-trip form. */
function padParse(txt){
  return String(txt||"").split(/\r?\n/).map(function(l){
    var v=l.trim();
    if(!v)return null;
    var m=v.match(/^[-*]?\s*\[\s*([xX])?\s*\]\s*(.*)$/);
    if(m)return {t:String(m[2]||"").trim(),d:!!m[1]};
    return {t:v,d:false};
  }).filter(function(x){return x&&x.t});
}
function padToText(){
  return ITEMS.map(function(i){
    return isHeadingLine(i.t)?i.t:((i.d?"[x] ":"[ ] ")+i.t);
  }).join("\n");
}

/* Storage stays on the SAME key. A value starting "[" is the new JSON form;
   anything else is the old plain text and gets migrated on read, so notes
   already sitting in the pad survive this change as unchecked items. */
function padLoad(){
  var raw=g(K_PAD);
  if(raw==null)return [];
  if(raw.charAt(0)==="["){
    try{
      var a=JSON.parse(raw);
      if(Array.isArray(a)&&a.every(function(x){return x&&typeof x.t==="string"}))
        return a.map(function(x){return {t:x.t,d:!!x.d}});
    }catch(e){}
  }
  return padParse(raw);
}
function padSave(){
  var ok=s(K_PAD,JSON.stringify(ITEMS.map(function(i){return {t:i.t,d:i.d?1:0}})));
  saved.textContent=ok
    ?"Saved "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})
    :"Not saved \u2014 storage blocked";
  return ok;
}
function padSaveSoon(){
  saved.textContent="Saving\u2026";
  if(timer)clearTimeout(timer);
  timer=setTimeout(function(){timer=null;padSave()},400);
}
function padFlush(){ if(timer){clearTimeout(timer);timer=null;padSave()} }

function padToFile(){
  return ITEMS.filter(function(i){return !i.d&&!isHeadingLine(i.t)&&i.t.trim()});
}
function padStats(){
  var f=padToFile().length,
      c=ITEMS.filter(function(i){return i.d}).length,
      parts=[];
  if(f)parts.push(f+" to file");
  if(c)parts.push(c+" checked");
  padN.textContent=parts.join("  \u00b7  ");
  var sw=D("lbxsweep");
  if(sw){
    sw.disabled=!ITEMS.length;
    sw.textContent=f?("Sweep "+f+" to task list"):"Clear the list";
  }
}

/* One row. Text edits mutate the item in place and never re-render, so the
   caret stays put; only structural changes (add, delete) redraw. */
function padRow(it,ix){
  var row=E("div","lbxitem"+(it.d?" done":"")+(isHeadingLine(it.t)?" head":""));

  var cb=E("button","cb"+(it.d?" done":""),it.d?"\u2713":"");
  cb.type="button";
  cb.setAttribute("aria-label","Mark done");
  cb.setAttribute("aria-pressed",String(!!it.d));
  cb.onclick=function(){
    it.d=!it.d;
    row.classList.toggle("done",it.d);
    cb.classList.toggle("done",it.d);
    cb.textContent=it.d?"\u2713":"";
    cb.setAttribute("aria-pressed",String(it.d));
    padFlush();padSave();padStats();
  };
  row.appendChild(cb);

  var inp=document.createElement("input");
  inp.type="text";inp.className="lbxitext";inp.value=it.t;
  inp.setAttribute("aria-label","List item");
  inp.oninput=function(){
    it.t=inp.value;
    row.classList.toggle("head",isHeadingLine(it.t));
    padSaveSoon();padStats();
  };
  inp.onblur=padFlush;
  inp.onkeydown=function(e){
    if(e.key==="Enter"){
      e.preventDefault();padFlush();
      ITEMS.splice(ix+1,0,{t:"",d:false});
      padSave();drawPad(ix+1);
    }else if(e.key==="Backspace"&&inp.value===""&&ITEMS.length>1){
      e.preventDefault();padFlush();
      ITEMS.splice(ix,1);
      padSave();drawPad(Math.max(0,ix-1),true);
    }else if(e.key==="ArrowDown"&&ix<ITEMS.length-1){
      e.preventDefault();focusRow(ix+1);
    }else if(e.key==="ArrowUp"&&ix>0){
      e.preventDefault();focusRow(ix-1);
    }
  };
  row.appendChild(inp);

  var x=E("button","lbxix","\u00d7");
  x.type="button";x.title="Remove this line";x.setAttribute("aria-label","Remove this line");
  x.onclick=function(){
    padFlush();ITEMS.splice(ix,1);padSave();drawPad(Math.max(0,ix-1),true);
  };
  row.appendChild(x);
  return row;
}

function focusRow(ix,toEnd){

  if(!all.length)return;

function drawPad(focusIx,toEnd){

/* Render each frog with v11's OWN taskEl(), so the checkbox, the detail
   editor, heat, pills and the frog toggle all behave exactly as they do on
   the board — no second implementation to drift out of sync. Drag-to-nest is
   switched off here: this tab is a worklist, and an accidental drop would
   silently re-parent a task. */
function drawFrogs(){
  var list=boardFrogs();
  frogs.textContent="";
  if(!list.length){
    frogs.appendChild(E("p","none",
      "No frogs tagged. Hit the \uD83D\uDC38 on any task and it shows up here."));
    return;
  }
  list.forEach(function(t){
    var row=null;
    try{ if(typeof taskEl==="function")row=taskEl(t,false); }catch(e){ row=null; }
    if(row){
      row.draggable=false;
      row.removeAttribute("draggable");
      row.ondragstart=null;row.ondragover=null;row.ondrop=null;row.ondragleave=null;
      frogs.appendChild(row);
    }else{
      /* taskEl unavailable — degrade to a plain line rather than render nothing */
      frogs.appendChild(E("p","none",t.title||"(untitled)"));
    }
  });
}
/* Unchecked items become tasks. Checked ones are deliberately NOT filed —
   they are already done — but the sweep clears the WHOLE list either way, so
   the confirm spells that out rather than quietly binning them. */
async function sweep(){
  padFlush();
  var total=ITEMS.length;
  if(!total)return;
  var toFile=padToFile(),
      checked=ITEMS.filter(function(i){return i.d}).length,
      heads=ITEMS.filter(function(i){return isHeadingLine(i.t)}).length;

  var msg;
  if(toFile.length){
    msg="File "+toFile.length+" unchecked item"+(toFile.length===1?"":"s")+
        " as task"+(toFile.length===1?"":"s")+" under Unreviewed Intake, then clear the whole list.";
    var gone=[];
    if(checked)gone.push(checked+" checked off");
    if(heads)gone.push(heads+" heading"+(heads===1?"":"s"));
    if(gone.length)msg+="\n\n"+gone.join(" and ")+" will NOT be filed and will be deleted.";
  }else{
    msg="Nothing unchecked to file.\n\nClear all "+total+" item"+(total===1?"":"s")+
        "? They will be deleted, not filed.";
  }
  if(!confirm(msg))return;

  /* Check reachability BEFORE writing anything, so this can't half-file. */
  if(toFile.length&&(typeof TASKS==="undefined"||typeof nowISO!=="function")){
    alert("Couldn't reach the task list — nothing was filed and the list is untouched.");
    return;
  }
  var made=0;
  toFile.forEach(function(i){if(boardAdd(i.t))made++});

  ITEMS=[];padSave();drawPad();
  if(made){
    if(typeof save==="function")await save();
    if(typeof render==="function")render();
  }
  drawFrogs();
  var note=made?("Swept "+made+" to Unreviewed Intake"):"List cleared";
  if(made&&checked)note+=" \u00b7 "+checked+" checked deleted";
  saved.textContent=note;say(note);
}

/* ============================================================
   4b.  Events  —  "Stand And Deliver"

   Event records live in META.events, NOT in a private LBX key.
   META is already part of save(), the backup export, the import
   path and the GitHub sync payload, so events travel with the
   board for free. A private key would have quietly left them out
   of every backup you take.

   A task is linked by an optional t.event holding an event id.
   Unlinked tasks are untouched and behave exactly as before.
   ============================================================ */
var SADOPEN=new Set(), SUPPRESS_EV=false, K_SAD="LBX.sad.closed";

function evAll(){
  if(typeof META==="undefined"||!META)return[];
  if(!Object.prototype.hasOwnProperty.call(META,"events")||!Array.isArray(META.events))META.events=[];
  return META.events;
}
function evById(id){
  if(!id)return null;
  var a=evAll();
  for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
  return null;
}
function evNewId(){return "E-"+Math.random().toString(36).slice(2,8)}
function evDate(v){ try{ return (typeof pd==="function")?pd(v):null; }catch(e){ return null; } }
/* an event is past only once its LAST day has gone by */
function evEnd(e){ return evDate(e.end)||evDate(e.start); }
function evIsPast(e){
  var end=evEnd(e); if(!end)return false;
  var today=(typeof TODAY!=="undefined"&&TODAY)?TODAY:new Date();
  return end<today;
}
function evFmt(e){
  var s=evDate(e.start), en=evDate(e.end);
  var o={month:"short",day:"numeric"};
  if(!s)return "no date set";
  var a=s.toLocaleDateString([],Object.assign({year:"numeric"},o));
  if(!en||en.getTime()===s.getTime())return a;
  var sameYear=en.getFullYear()===s.getFullYear();
  return s.toLocaleDateString([],o)+" – "+en.toLocaleDateString([],
    sameYear?Object.assign({year:"numeric"},o):Object.assign({year:"numeric"},o));
}
function evCountdown(e){
  var s=evDate(e.start); if(!s)return "";
  var today=(typeof TODAY!=="undefined"&&TODAY)?TODAY:new Date();
  var d=Math.round((s-today)/864e5);
  if(evIsPast(e))return "done";
  if(d<0)return "under way";
  if(d===0)return "today";
  if(d===1)return "tomorrow";
  if(d<=30)return "in "+d+" days";
  return "in "+Math.round(d/7)+" weeks";
}

/* Events: soonest first. Anything already finished drops below, most
   recent first, so the top of the tab is always what's coming. */
function evSorted(){
  var a=evAll().slice();
  a.sort(function(x,y){
    var px=evIsPast(x), py=evIsPast(y);
    if(px!==py)return px?1:-1;
    var dx=evDate(x.start), dy=evDate(y.start);
    if(!dx&&!dy)return String(x.title||"").localeCompare(String(y.title||""));
    if(!dx)return 1;
    if(!dy)return -1;
    if(dx.getTime()===dy.getTime())return String(x.title||"").localeCompare(String(y.title||""));
    return px ? dy-dx : dx-dy;      /* past runs newest-first */
  });
  return a;
}

function evTasks(id){
  if(typeof alive!=="function")return[];
  return alive().filter(function(t){return t.event===id});
}
function isDone(t){return t.status==="Done"||t.status==="Archived"}

/* Within an event: hottest first, earliest due date breaks a tie,
   and anything scoring zero heat (paused, or no signal at all) sinks
   to the bottom rather than mixing in. */
function evSortTasks(list){
  return list.slice().sort(function(a,b){
    var ha=0,hb=0;
    try{ ha=heat(a).n; hb=heat(b).n; }catch(e){}
    if((ha===0)!==(hb===0))return ha===0?1:-1;
    if(ha!==hb)return hb-ha;
    var da=evDate(a.due), db=evDate(b.due);
    if(da&&db&&da.getTime()!==db.getTime())return da-db;
    if(da&&!db)return -1;
    if(!da&&db)return 1;
    return String(a.title||"").localeCompare(String(b.title||""));
  });
}

function evLoadClosed(){
  try{ var r=g(K_SAD); if(r)SADOPEN=new Set(JSON.parse(r)); }catch(e){ SADOPEN=new Set(); }
}
function evSaveClosed(){
  /* Array.prototype.slice.call(aSet) silently yields [] — a Set has no length.
     That wrote an empty array every time and collapse state never persisted. */
  try{ s(K_SAD,JSON.stringify(Array.from(SADOPEN))); }catch(e){}
}

async function evCommit(){
  try{ if(typeof save==="function")await save(); }catch(e){}
  try{ if(typeof render==="function")render(); }catch(e){}
}

function evAdd(title,start,end){
  var a=evAll();
  a.push({id:evNewId(),title:String(title||"Untitled event").trim()||"Untitled event",
          start:start||"",end:end||"",created:(typeof nowISO==="function")?nowISO():""});
  return a[a.length-1];
}
async function evDelete(ev){
  var linked=evTasks(ev.id);
  if(!confirm('Delete "'+ev.title+'"?'+(linked.length
      ? "\n\n"+linked.length+" task"+(linked.length===1?"":"s")+" will be unlinked. The task"+
        (linked.length===1?"":"s")+" themselves are NOT deleted."
      : "")))return;
  linked.forEach(function(t){ t.event=""; try{ if(typeof touch==="function")touch(t); }catch(e){} });
  var a=evAll();
  for(var i=a.length-1;i>=0;i--)if(a[i].id===ev.id)a.splice(i,1);
  SADOPEN.delete(ev.id); evSaveClosed();
  await evCommit();
  say("Event deleted"+(linked.length?" — "+linked.length+" task"+(linked.length===1?"":"s")+" unlinked":""));
}

/* ---------- the panel ---------- */
var sadWrap, sadForm, badgeSad=null, EDITING=null;

function evFormOpen(ev){

async function evFormSave(){

  if(!t){ alert("Give the event a title."); D("lbxevTitle").focus(); return; }
  if(st&&en&&en<st){ alert("The end date is before the start date."); return; }
  if(EDITING){ EDITING.title=t; EDITING.start=st; EDITING.end=en; }
  else { var ne=evAdd(t,st,en); SADOPEN.delete(ne.id); }

function evRow(ev,idx){
  var box=E("div","lbxev "+MVCLASS[idx%4]+(evIsPast(ev)?" past":""));
  var open=!SADOPEN.has(ev.id);
  var open_=evTasks(ev.id).filter(function(t){return !isDone(t)});
  var done_=evTasks(ev.id).filter(isDone);

  var h=E("div","lbxevh");
  h.setAttribute("role","button");h.tabIndex=0;
  h.setAttribute("aria-expanded",String(open));
  h.appendChild(E("span","lbxevcv",open?"\u25BE":"\u25B8"));
  h.appendChild(E("span","lbxevt",ev.title));
  h.appendChild(E("span","lbxevd",evFmt(ev)));
  var cd=evCountdown(ev); if(cd)h.appendChild(E("span","lbxevwhen",cd));
  h.appendChild(E("span","lbxevn",String(open_.length)));

  var tools=E("div","lbxevtools");
  var ed=E("button","mini","Edit"); ed.type="button";
  ed.onclick=function(e){e.stopPropagation();evFormOpen(ev)};
  var dl=E("button","mini danger","Delete"); dl.type="button";
  dl.onclick=function(e){e.stopPropagation();evDelete(ev)};
  tools.appendChild(ed);tools.appendChild(dl);
  h.appendChild(tools);

  function toggle(){
    if(SADOPEN.has(ev.id))SADOPEN.delete(ev.id); else SADOPEN.add(ev.id);
    evSaveClosed(); drawSAD();
  }
  h.onclick=toggle;
  h.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
  box.appendChild(h);

  if(open){
    var body=E("div","lbxevbody");
    if(!open_.length&&!done_.length){
      body.appendChild(E("p","lbxevempty",
        "Nothing tied to this event yet. Open any task and pick it in the Event field."));
    }
    if(open_.length){
      SUPPRESS_EV=true;
      evSortTasks(open_).forEach(function(t){
        var row=null;
        try{ if(typeof taskEl==="function")row=taskEl(t,false); }catch(e){ row=null; }
        if(row){
          row.draggable=false;row.removeAttribute("draggable");
          row.ondragstart=null;row.ondragover=null;row.ondrop=null;row.ondragleave=null;
          body.appendChild(row);
        }else body.appendChild(E("p","lbxevempty",t.title||"(untitled)"));
      });
      SUPPRESS_EV=false;
    }
    if(done_.length){
      var det=E("details","lbxdonewrap");
      var sm=E("summary",null,"Completed ("+done_.length+")");
      det.appendChild(sm);
      SUPPRESS_EV=true;
      evSortTasks(done_).forEach(function(t){
        var row=null;
        try{ if(typeof taskEl==="function")row=taskEl(t,false); }catch(e){ row=null; }
        if(row){
          row.draggable=false;row.removeAttribute("draggable");
          row.ondragstart=null;row.ondragover=null;row.ondrop=null;row.ondragleave=null;
          det.appendChild(row);
        }
      });
      SUPPRESS_EV=false;
      body.appendChild(det);
    }
    box.appendChild(body);
  }
  return box;
}

var MVCLASS=["mv1","mv2","mv3","mv4"];

function drawSAD(){
  if(!sadWrap)return;
  sadWrap.textContent="";

  if(!list.length){
    var em=E("div","empty","No events yet. Add one, then tie tasks to it from the Event field on any task.");
    sadWrap.appendChild(em);

/* Injected into v11's detailEl output, placed just above the Actions row.
   Writes through immediately like every other field in that editor. */
function evInjectField(w,t){
  if(!w||!t||w.querySelector("[data-lbxev]"))return;

  var sel=E("select");
  sel.setAttribute("data-lbxev","1");
  sel.style.width="100%";
  sel.setAttribute("aria-label","Event");

  var list=evSorted();
  var none=E("option",null,list.length
    ? "\u2014 not tied to an event \u2014"
    : "\u2014 no events yet, add one in Stand And Deliver \u2014");
  none.value="";
  sel.appendChild(none);

  list.forEach(function(ev){
    var o=E("option",null,ev.title+(ev.start?"  \u00b7  "+evFmt(ev):""));
    o.value=ev.id;
    if(t.event===ev.id)o.selected=true;
    sel.appendChild(o);
  });

  /* A task pointing at a deleted event keeps its id and says so, rather than
     silently snapping back to "none" and losing the link without telling you. */
  if(t.event&&!evById(t.event)){
    var orphan=E("option",null,"\u26A0 event no longer exists");
    orphan.value=t.event; orphan.selected=true;
    sel.insertBefore(orphan,sel.firstChild.nextSibling);
  }

  sel.onchange=async function(){
    t.event=sel.value;
    try{ if(typeof touch==="function")touch(t); }catch(e){}
    await evCommit();
  };

  var f=E("div","fld");
  f.appendChild(E("div","k","Event"));
  f.appendChild(sel);

  var target=null, flds=w.querySelectorAll(".fld");
  for(var i=0;i<flds.length;i++){
    var k=flds[i].querySelector(".k");
    if(k&&k.textContent==="Actions"){target=flds[i];break}
  }
  if(target)w.insertBefore(f,target); else w.appendChild(f);
}

/* ============================================================
   Tabs — existing nodes are MOVED into panels, never rebuilt,
   so every id render() writes to still resolves.
   ============================================================ */
var TABS=["tasks","links","finder","pad","sad"];
function show(name){
  TABS.forEach(function(t){
    var tab=D("lbxtab-"+t),p=D("lbxpanel-"+t);
    if(!tab||!p)return;
    var on=t===name;
    tab.setAttribute("aria-selected",on?"true":"false");
    tab.tabIndex=on?0:-1;p.hidden=!on});
  s(K_TAB,name);
  /* v11's Launch Pad heading is a collapse toggle: it flips LPOPEN and
     renderLinks() then returns early, leaving #links genuinely EMPTY —
     not merely hidden. Inside a tab the tab itself is the collapse, so
     keep the section open and let the heading just re-render (it carries
     the link count). */
  if(name==="links"){
    try{ if(typeof LPOPEN!=="undefined")LPOPEN=true; }catch(e){}
    try{ if(typeof renderLinks==="function")renderLinks(); }catch(e){}
    var lk=D("links"); if(lk)lk.style.display="";
  }
  if(name==="pad"){drawFrogs();padStats()}
  if(name==="sad"){drawSAD()}

}

function boot(){
  var wrap=document.querySelector(".wrap"),
      banner=document.querySelector(".banner"),
      foot=document.querySelector("footer");
  if(!wrap||!banner)return;

  /* capture refs BEFORE moving anything */
  var hDone=D("hDone"), doneSub=hDone?hDone.nextElementSibling:null,
      done=D("done"), strip=D("strip"), bar=document.querySelector(".bar"),
      list=D("list"), hLinks=D("hLinks"), lSub=D("linksSub"),
      lTools=D("linkTools"), links=D("links");

  var tabs=E("div","lbxtabs");
  tabs.setAttribute("role","tablist");
  tabs.setAttribute("aria-label","Launch Pad sections");
  var LABELS={tasks:"Tasks",links:"Launch Pad",finder:"Chat Finder",
               pad:"Maksim-um Cluster-Files",sad:"Stand And Deliver"};
  TABS.forEach(function(t){
    var b=E("button","lbxtab");
    b.id="lbxtab-"+t;b.type="button";b.setAttribute("role","tab");
    b.setAttribute("aria-controls","lbxpanel-"+t);b.setAttribute("aria-selected","false");
    b.appendChild(document.createTextNode(LABELS[t]));
    if(t==="finder"){var n=E("span","lbxn","0");n.id="lbxcount";n.hidden=true;b.appendChild(n)}
    if(t==="sad"){var n2=E("span","lbxn","0");n2.id="lbxsadcount";n2.hidden=true;b.appendChild(n2)}
    b.onclick=function(){show(t)};
    tabs.appendChild(b)});
  tabs.addEventListener("keydown",function(e){
    var i=TABS.indexOf((document.activeElement.id||"").replace("lbxtab-",""));
    if(i===-1)return;var j=null;
    if(e.key==="ArrowRight")j=(i+1)%TABS.length;
    else if(e.key==="ArrowLeft")j=(i-1+TABS.length)%TABS.length;
    else if(e.key==="Home")j=0;else if(e.key==="End")j=TABS.length-1;
    if(j===null)return;e.preventDefault();show(TABS[j]);D("lbxtab-"+TABS[j]).focus()});
  banner.insertAdjacentElement("afterend",tabs);

  function panel(id){var p=E("div","lbxpanel");p.id="lbxpanel-"+id;
    p.setAttribute("role","tabpanel");p.setAttribute("aria-labelledby","lbxtab-"+id);
    p.tabIndex=0;p.hidden=true;
    foot?wrap.insertBefore(p,foot):wrap.appendChild(p);return p}

  var pT=panel("tasks"),pL=panel("links"),pF=panel("finder"),pP=panel("pad"),pS=panel("sad");
  [strip,bar,list,hDone,doneSub,done].forEach(function(n){if(n)pT.appendChild(n)});
  [hLinks,lSub,lTools,links].forEach(function(n){if(n)pL.appendChild(n)});

  /* Clicking the heading used to collapse the section to nothing. That made
     sense as a page section; as a tab panel it just empties the panel. Keep
     the heading (it shows the link count) but make it always render open. */
  if(hLinks){
    hLinks.onclick=function(){
      try{ if(typeof LPOPEN!=="undefined")LPOPEN=true; }catch(e){}
      try{ if(typeof renderLinks==="function")renderLinks(); }catch(e){}
    };
    hLinks.style.cursor="default";
  }

  /* ---- finder markup ---- */
  pF.innerHTML=
   '<div id="lbxloaded" hidden>'
  +'<div class="lbxrow">'
  +'<input type="search" id="lbxq" placeholder="Search titles, keywords, projects…" autocomplete="off" aria-label="Search chats">'
  +'<select id="lbxtool" aria-label="Filter by tool"><option value="">All tools</option></select>'
  +'<select id="lbxproj" aria-label="Filter by project"><option value="">All projects</option></select>'
  +'<button id="lbxclear" type="button">Clear</button>'
  +'<button id="lbxnew" type="button">Load new CSV</button></div>'
  +'<p class="lbxmeta" id="lbxmeta" aria-live="polite"></p>'
  +'<div class="lbxscroll"><table class="lbxtbl"><thead><tr>'
  +'<th data-sort="date" tabindex="0" scope="col">Date<span class="lbxdir"></span></th>'
  +'<th data-sort="tool" tabindex="0" scope="col">Tool<span class="lbxdir"></span></th>'
  +'<th data-sort="title" tabindex="0" scope="col">Title<span class="lbxdir"></span></th>'
  +'<th data-sort="keywords" tabindex="0" scope="col">Keywords<span class="lbxdir"></span></th>'
  +'<th data-sort="project" tabindex="0" scope="col">Project<span class="lbxdir"></span></th>'
  +'</tr></thead><tbody id="lbxbody"></tbody></table></div>'
  +'<p class="lbxmeta" id="lbxtrunc" hidden></p></div>'
  +'<div id="lbxblank">'
  +'<p class="lbxnote"><b>Drive can\'t be a live source.</b> It redirects through a consent screen and blocks the '
  +'cross-origin read, so a page can\'t fetch a CSV from it. Export the sheet and drop the file here, or use '
  +'File → Share → Publish to web → CSV and paste the rows. Once loaded it\'s cached locally and survives a refresh.</p>'
  +'<div class="lbxdrop" id="lbxdrop"><p style="margin:0 0 12px"><b style="color:var(--text)">Drop your CSV here</b><br>or pick the file</p>'
  +'<input type="file" id="lbxfile" accept=".csv,text/csv,text/plain" style="display:none">'
  +'<button class="pri" id="lbxpick" type="button">Choose CSV file</button></div>'
  +'<details class="lbxdet"><summary>Paste rows instead</summary>'
  +'<p class="lbxmeta">Copy straight out of the sheet — tab-separated works too.</p>'
  +'<textarea class="lbxpaste" id="lbxpastebox" placeholder="date,tool,title,keywords,project,url"></textarea>'
  +'<p style="margin:10px 0 0"><button class="pri" id="lbxloadpaste" type="button">Load pasted rows</button></p></details>'
  +'<details class="lbxdet"><summary>The six columns</summary><table class="lbxcols">'
  +'<tr><th>date</th><td>YYYY-MM-DD sorts correctly; other formats still display.</td></tr>'
  +'<tr><th>tool</th><td>Claude, ChatGPT, Gemini, Copilot. Becomes a dropdown filter.</td></tr>'
  +'<tr><th>title</th><td>Rewrite the auto-generated junk ones — that\'s where the search value is.</td></tr>'
  +'<tr><th>keywords</th><td>Your workhorse column. Three or four terms you\'d actually type.</td></tr>'
  +'<tr><th>project</th><td>Lighthouse, Deck Builds, Summit. Becomes the second dropdown.</td></tr>'
  +'<tr><th>url</th><td>Only http and https render as links.</td></tr></table>'
  +'<p class="lbxmeta" style="margin-top:9px">Column order doesn\'t matter, extra columns are ignored, headers match '
  +'case-insensitively, and aliases work: ai/platform for tool, tags for keywords, link for url.</p></details></div>';

  /* ---- cluster-files markup ---- */
  pP.innerHTML=
   '<div class="lbxpad2">'
  +'<section class="lbxfrogs"><h3>Today\'s frogs'
  +'<span class="lbxhint">full rows — tick one off, or click a title to open it</span></h3>'
  +'<div id="lbxfrogs"></div></section>'
  +'<section><h3 class="lbxpadhead">Notes</h3>'
  +'<div id="lbxlist"></div>'
  +'<div class="lbxaddbar"><button id="lbxadd" type="button">+ Add line</button>'
  +'<button id="lbxbulk" type="button">Paste / bulk edit</button></div>'
  +'<div class="lbxbulkbox" id="lbxbulkBox" hidden>'
  +'<label for="lbxbulkText">One item per line. <b>[x]</b> marks it done, '
  +'<b>#</b> makes it a heading, anything else comes in unchecked.</label>'
  +'<textarea id="lbxbulkText" aria-label="Bulk edit the list"></textarea>'
  +'<div class="acts"><button id="lbxbulkCancel" type="button">Cancel</button>'
  +'<button class="pri" id="lbxbulkApply" type="button">Replace the list</button></div></div>'
  +'<div class="lbxpadbar"><span id="lbxsaved">&nbsp;</span><span class="sp"></span>'
  +'<span id="lbxpadn"></span><button id="lbxsweep" type="button">Sweep to task list</button></div>'
  +'<p class="lbxmeta" style="margin-top:12px">Unchecked items are filed as tasks under '
  +'<b>Unreviewed Intake</b>. Checked ones are not filed \u2014 but sweeping clears the whole '
  +'list either way, so anything ticked off is deleted. Lines starting with # are headings.</p>'
  +'</section></div>';

  /* ---- stand and deliver markup ---- */
  pS.innerHTML=
   '<div class="lbxsadbar">'
  +'<button class="pri" id="lbxevNew" type="button">Add event</button>'
  +'<span class="lbxmeta" style="margin:0">Events run soonest first. Inside each one, tasks sort by heat, '
  +'then by due date when heat ties.</span></div>'
  +'<div class="lbxevform" id="lbxevForm" hidden>'
  +'<div class="lbxmeta" style="margin:0 0 10px"><b id="lbxevFormH" style="color:var(--darkTeal)">New event</b></div>'
  +'<div class="row">'
  +'<div><label for="lbxevTitle">Event title</label><input type="text" id="lbxevTitle" placeholder="Croswell-Lexington PD day"></div>'
  +'<div><label for="lbxevStart">Start date</label><input type="date" id="lbxevStart"></div>'
  +'<div><label for="lbxevEnd">End date (optional)</label><input type="date" id="lbxevEnd"></div>'
  +'</div>'
  +'<div class="acts"><button id="lbxevCancel" type="button">Cancel</button>'
  +'<button class="pri" id="lbxevSave" type="button">Add event</button></div></div>'
  +'<div id="lbxsad"></div>';

  /* ---- wire ---- */
  sadWrap=D("lbxsad"); sadForm=D("lbxevForm"); badgeSad=D("lbxsadcount");
  evLoadClosed();
  D("lbxevNew").onclick=function(){ sadForm.hidden?evFormOpen(null):evFormClose() };
  D("lbxevCancel").onclick=evFormClose;
  D("lbxevSave").onclick=evFormSave;
  D("lbxevTitle").onkeydown=function(e){ if(e.key==="Enter"){e.preventDefault();evFormSave()} };
  D("lbxevForm").addEventListener("keydown",function(e){ if(e.key==="Escape")evFormClose() });

  q=D("lbxq");fTool=D("lbxtool");fProj=D("lbxproj");body=D("lbxbody");
  meta=D("lbxmeta");trunc=D("lbxtrunc");badge=D("lbxcount");
  loaded=D("lbxloaded");blank=D("lbxblank");
  listEl=D("lbxlist");saved=D("lbxsaved");padN=D("lbxpadn");frogs=D("lbxfrogs");
  bulkBox=D("lbxbulkText");

  q.oninput=function(){apply()};
  q.onkeydown=function(e){if(e.key==="Escape"){q.value="";apply()}};
  fTool.onchange=apply;fProj.onchange=apply;
  D("lbxclear").onclick=function(){q.value="";fTool.value="";fProj.value="";apply();q.focus()};
  D("lbxnew").onclick=function(){
    if(!confirm("Clear the loaded chats and start over?"))return;
    rm(K_CSV);ROWS=[];VIEW=[];loaded.hidden=true;blank.hidden=false;badge.hidden=true};
  document.querySelectorAll(".lbxtbl th[data-sort]").forEach(function(th){
    function go(){var f=th.getAttribute("data-sort");
      if(SORT.f===f)SORT.dir=-SORT.dir;else SORT={f:f,dir:f==="date"?-1:1};
      sortView();draw()}
    th.onclick=go;
    th.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  D("lbxpick").onclick=function(){D("lbxfile").click()};
  D("lbxfile").onchange=function(e){readFile(e.target.files[0])};
  D("lbxloadpaste").onclick=function(){
    var v=D("lbxpastebox").value.trim();
    if(!v){alert("Nothing pasted yet.");return}
    if(loadCsv(v))D("lbxpastebox").value=""};
  var drop=D("lbxdrop");
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
  drop.addEventListener("drop",function(e){
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])});

  var had=g(K_PAD);
  ITEMS=padLoad();
  drawPad();
  /* Migration converts in memory; write it back straight away so the stored
     format actually settles rather than being re-migrated on every load. */
  if(had!==null&&had.charAt(0)!=="["){ padSave(); }

  D("lbxadd").onclick=function(){
    padFlush();ITEMS.push({t:"",d:false});padSave();drawPad(ITEMS.length-1);
  };
  D("lbxbulk").onclick=function(){
    padFlush();
    var box=D("lbxbulkBox");
    if(box.hidden){ bulkBox.value=padToText(); box.hidden=false; bulkBox.focus(); }
    else box.hidden=true;
  };
  D("lbxbulkCancel").onclick=function(){ D("lbxbulkBox").hidden=true; };
  D("lbxbulkApply").onclick=function(){
    var next=padParse(bulkBox.value);
    if(!next.length&&ITEMS.length&&
       !confirm("That empties the list. "+ITEMS.length+" item"+(ITEMS.length===1?"":"s")+" will be deleted. Continue?"))return;
    ITEMS=next;padSave();D("lbxbulkBox").hidden=true;drawPad();
    say(ITEMS.length?(ITEMS.length+" item"+(ITEMS.length===1?"":"s")+" loaded"):"List cleared");
  };
  D("lbxsweep").onclick=sweep;
  drawFrogs();
  if(had&&ITEMS.length)saved.textContent="Restored from last session";
  else if(had&&!ITEMS.length)saved.textContent="&nbsp;";

  /* complete(), the detail editor and the frog toggle all end in render().
     Wrap it so these panels repaint on the same cycle — otherwise ticking a
     frog here would update TASKS and the board but leave this list stale,
     which is exactly the kind of silent divergence that bites later.
     Function declarations land on the global object, so his internal calls
     to render() resolve through this wrapper too. */
  if(typeof window.render==="function"){
    var _render=window.render;
    window.render=function(){
      var out=_render.apply(this,arguments);
      try{ if(frogs)drawFrogs(); }catch(e){}
      try{ if(sadWrap)drawSAD(); }catch(e){}
      return out;
    };
  }

  /* The Event field is injected into v11's OWN detailEl() rather than
     rebuilt, so it appears on every task row everywhere — the board, the
     frogs list, and inside an event group — and inherits the same styling
     and save-as-you-change behaviour as every other field. */
  if(typeof window.detailEl==="function"){
    var _detailEl=window.detailEl;
    window.detailEl=function(t){
      var w=_detailEl.apply(this,arguments);
      try{ evInjectField(w,t); }catch(e){}
      return w;
    };
  }

  /* A small pill so a linked task is identifiable on the board itself.
     Suppressed while rendering inside an event group, where it'd be noise. */
  if(typeof window.taskEl==="function"){
    var _taskEl=window.taskEl;
    window.taskEl=function(t,isKid){
      var d=_taskEl.apply(this,arguments);
      try{
        if(!SUPPRESS_EV&&t&&t.event){
          var ev=evById(t.event);
          var m=d.querySelector(".meta");
          if(ev&&m)m.appendChild(E("span","pill lbxevpill","\u25C6 "+ev.title));
        }
      }catch(e){}
      return d;
    };
  }

  /* "/" jumps to search — but never while typing in a field */
  document.addEventListener("keydown",function(e){
    if(e.key!=="/")return;
    var t=e.target.tagName;
    if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
    e.preventDefault();show("finder");if(!loaded.hidden)q.focus()});

  restore();
  var last=g(K_TAB);
  show(TABS.indexOf(last)!==-1?last:"tasks");

  /* His boot is `(async()=>{ await load(); … render() })()`, so it can finish
     BEFORE this patch's DOMContentLoaded handler installs the wrappers — in
     which case the first paint has no event pills and the tab badge is never
     set. One repaint here makes the result independent of that ordering. */
  try{ if(typeof window.render==="function")window.render(); }catch(e){}
  try{ drawSAD(); }catch(e){}
}

LBX.show=show;LBX.loadCsv=loadCsv;LBX.build=build;LBX.safeUrl=safeUrl;
LBX.items=function(){return ITEMS};LBX.padText=function(){return padToText()};
LBX.events=function(){return evAll()};
LBX.dkey=dkey;LBX.parseDelim=parseDelim;LBX.refreshFrogs=function(){if(frogs)drawFrogs()};

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
